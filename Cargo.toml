[package]
name = "novara-node"
version = "0.1.0"
edition = "2024"
description = "NOVARA independent Layer-1 blockchain"

[lib]
name = "novara"
path = "src/lib.rs"

[[bin]]
name = "novara-node"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
